# Sign-out journey (#41) on the iOS simulator, in Expo Go (docs/specs.md, "Tests"):
# cancel keeps the account; sign out, restart the app, and nobody is signed in any more.
#
# Before: the same simulator setup as sign-in.yaml.
# After: nobody is signed in again, so the flow can run again.
#
# maestro --device <simulator id> test -e EMAIL=<test account> -e PASSWORD=<its password> .maestro/sign-out.yaml
# Metro on another port than 8081: add -e APP_URL=exp://127.0.0.1:<port>

# the app runs inside Expo Go: Maestro starts and stops Expo Go, and opens the app by its URL
appId: host.exp.Exponent
---
- stopApp
- openLink: ${APP_URL || 'exp://127.0.0.1:8081'}
# iOS asks before opening a link in another app, then for the motion access (the steps)
- tapOn:
    text: 'Open|Ouvrir'
    optional: true
- tapOn:
    text: 'Allow|Autoriser'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'settings-button'
    timeout: 60000

# signed in first
- tapOn:
    id: 'settings-button'
- tapOn: 'Se connecter'
- tapOn:
    id: 'sign-in-email'
- inputText: ${EMAIL}
- tapOn:
    id: 'sign-in-password'
- inputText: ${PASSWORD}
# the button stays above the keyboard (AccountForm)
- tapOn: 'SE CONNECTER'
- extendedWaitUntil:
    notVisible: 'SE CONNECTER'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'settings-button'
    timeout: 15000
- tapOn:
    id: 'settings-button'
- assertVisible: 'Compte, .*'

# cancel: back on the settings, still signed in
- tapOn: 'Se déconnecter'
- tapOn: 'ANNULER'
- assertVisible: 'Compte, .*'

# sign out: the home screen opens as a guest
- tapOn: 'Se déconnecter'
- tapOn: 'SE DÉCONNECTER'
- extendedWaitUntil:
    visible:
      id: 'settings-button'
    timeout: 15000

# restart: the session has left the phone (docs/specs.md, "Session")
- stopApp
- openLink: ${APP_URL || 'exp://127.0.0.1:8081'}
- tapOn:
    text: 'Open|Ouvrir'
    optional: true
- tapOn:
    text: 'Allow|Autoriser'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'settings-button'
    timeout: 60000
- tapOn:
    id: 'settings-button'
- assertVisible: 'Se connecter'
- assertNotVisible: 'Compte, .*'
